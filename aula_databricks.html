
<!doctype html>

<meta name="description" content="Plataforma interativa para aprender Databricks do zero ao avançado.">

.nav .rec{width:6px;height:6px;border-radius:50%;background:var(--ac);margin-left:auto}

.top{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top .sp{flex:1}.srch{min-width:200px;display:flex;justify-content:space-between;gap:12px;color:var(--mut)}kbd{font-family:var(--mono);font-size:.72rem;background:var(--sf2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.lvl{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--mut)}.bar{height:8px;border-radius:99px;background:var(--sf2);overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#ff9a5a);border-radius:99px;transition:width .5s}
.main{padding:28px 32px 80px;max-width:1080px;width:100%;margin:0 auto}
.hero{padding:34px 0 10px}.hero h1{font-size:clamp(2.1rem,5vw,3.6rem);letter-spacing:-.03em}.hero h1 span{color:var(--ac)}.hero p{font-size:1.15rem;color:var(--mut);max-width:620px}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}
.cta{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}.cta button{padding:10px 20px;border-radius:10px;font-weight:600}
.mh{padding:6px 0 18px;border-bottom:1px solid var(--line);margin-bottom:22px}.mh h1{font-size:2rem;letter-spacing:-.02em}.mh p{color:var(--mut);margin:.4rem 0}
.badge{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:99px;background:var(--sf2);color:var(--mut);border:1px solid var(--line);margin-right:6px}
.badge.ac{background:var(--acs);color:var(--ac);border-color:transparent}

h3{font-size:1.08rem;margin:20px 0 6px}p{margin:.6rem 0}ul{padding-left:1.2rem}li{margin:.25rem 0}
.card{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}

.co.mis{--c:var(--red);--cs:var(--rds)}.co.cert{--c:var(--vio);--cs:var(--vis)}.co.perf{--c:var(--amb);--cs:var(--ams)}.co.po{--c:var(--grn);--cs:var(--grs)}.co.eng{--c:var(--ac);--cs:var(--acs)}.co.int{--c:var(--vio);--cs:var(--vis)}.co.arch{--c:var(--blue);--cs:var(--bls)}

.code{background:var(--code);color:var(--codeink);border-radius:12px;margin:12px 0;overflow:hidden;border:1px solid var(--line)}
.code .ch{display:flex;gap:6px;align-items:center;padding:6px 10px;background:rgba(255,255,255,.05);font-size:.74rem;color:#9aa3b0;flex-wrap:wrap}.code .ch .sp{flex:1}.code .ch button{background:none;border:1px solid #333a46;color:#c5cad3;padding:2px 8px;font-size:.72rem;border-radius:6px}.code .ch button.on{background:#e6e9ef;color:#111}
.code pre{margin:0;padding:10px 0;overflow:auto;font-family:var(--mono);font-size:.82rem;line-height:1.6}.ln{display:flex}.ln i{flex:0 0 38px;text-align:right;padding-right:12px;color:#5b6472;font-style:normal;user-select:none}.ln span{white-space:pre;padding-right:14px}
.k{color:#ff8a76}.s{color:#7ee0a8}.n{color:#f3c969}.c{color:#7c8696;font-style:italic}.f{color:#9db8ff}.d{color:#c9a7ff}
.exl{background:rgba(255,255,255,.04);padding:8px 14px;font-size:.84rem;color:#c5cad3;border-top:1px solid #262b34}.exl div{margin:3px 0}.exl code{color:#f3c969;font-family:var(--mono)}
.anat{border:1px solid var(--line);border-radius:14px;background:var(--sf);margin:14px 0;overflow:hidden}.anat>button{width:100%;border:0;background:var(--sf2);text-align:left;font-weight:600;display:flex;justify-content:space-between;border-radius:0;padding:10px 16px}.anat .ag{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.anat .ai{padding:12px 16px;border-top:1px solid var(--line)}.anat .ai b{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ac);display:block}.anat .ai div{font-size:.93rem}

.graph{position:relative}.graph svg{color:var(--mut);overflow:visible}.edge{fill:none;stroke:currentColor;stroke-width:1.5}.edge.up{stroke:var(--blue);color:var(--blue)}.edge.dn{stroke:var(--ac);color:var(--ac)}

.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border-radius:10px}.opt.ok{background:var(--grs);border-color:var(--grn)}.opt.no{background:var(--rds);border-color:var(--red)}

.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.kpi div{background:var(--sf2);border-radius:12px;padding:10px 12px}.kpi b{font-size:1.4rem;display:block}.kpi small{color:var(--mut)}
.tree{font-family:var(--mono);font-size:.84rem}.tree .tr{display:flex;gap:6px;padding:2px 6px;border-radius:6px;cursor:pointer;align-items:center}.tree .tr:hover{background:var(--sf2)}.tree .tr.sel{background:var(--acs);color:var(--ac)}

.rolecards .mc.sel{border-color:var(--ac);background:var(--acs)}

.sm .c{border:1px solid #e3e6ea;border-radius:8px;padding:6px 8px;background:#fff}[data-theme=dark] .sm .c{background:#151b23;border-color:#27303c}

.sm .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;position:static;animation:none}.sm .gn2{background:#1ea46b}.sm .rd2{background:#d4402f}.sm .ye2{background:#d9a21c}

.hs{position:absolute;z-index:5;width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;font-size:.7rem;display:grid;place-items:center;border:2px solid #fff;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.3);animation:pls 2s infinite}.hs.on{background:#111;animation:none}@keyframes pls{50%{transform:scale(1.18)}}

const G = [['lakehouse', 'Lakehouse', 'Arquitetura que combina a flexibilidade e o baixo custo de um data lake com a gestão transacional, a governança e a performance de um data warehouse, usando formatos abertos sobre object storage.'], ['delta lake', 'Delta Lake', 'Camada de armazenamento open source sobre arquivos Parquet que adiciona transações ACID, versionamento, schema enforcement e time travel via um transaction log (_delta_log).'], ['spark', 'Apache Spark', 'Engine de processamento distribuído em memória. O código roda no driver, que planeja o trabalho, e as tarefas rodam em executors, em paralelo.'], ['dataframe', 'DataFrame', 'Tabela distribuída e imutável com schema, manipulada por transformações lazy. É a principal API do Spark para SQL e Python.'], ['driver', 'Driver', 'Processo que roda o programa, constrói o plano (DAG), divide em stages/tasks e coordena os executors.'], ['executor', 'Executor', 'Processo nos workers que executa tasks e mantém dados em memória/disco. Cada executor tem N cores, e cada core roda uma task por vez.'], ['worker', 'Worker', 'Máquina (nó) do cluster que hospeda um ou mais executors.'], ['partition', 'Partition', 'Fatia do dado processada por uma única task. Não confundir partition do Spark (runtime) com particionamento de tabela (layout em disco).'], ['shuffle', 'Shuffle', 'Redistribuição de dados entre partitions pela rede e disco, necessária quando registros com a mesma chave precisam ficar juntos (groupBy, join, distinct). Geralmente é a operação mais cara.'], ['stage', 'Stage', 'Conjunto de tasks que rodam sem precisar de shuffle. Um shuffle cria a fronteira entre dois stages.'], ['task', 'Task', 'Menor unidade de trabalho: processa uma partition em um core de um executor.'], ['job', 'Job', 'Em Spark: o conjunto de stages disparado por uma action. Em Lakeflow Jobs: uma orquestração de tasks com dependências e agenda.'], ['compute', 'Compute', 'Recursos computacionais do Databricks: all-purpose (interativo), job compute,
